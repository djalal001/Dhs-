name: TraderDesk 1.4.0+35 APK
on:
  push:
    paths: [.github/workflows/build-140.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify archive and internal version
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, hashlib, re
          p = pathlib.Path('TraderDesk_Android_Project_v1.4.0+35.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '21185ae72f9f2cde95f3e4a31cf98cc427845f909209f33e1e66df5f1850ac15', 'Archive changed'
          root = pathlib.Path('source-140').resolve()
          root.mkdir()
          with zipfile.ZipFile(p) as z:
              for i in z.infolist():
                  assert (root / i.filename).resolve().is_relative_to(root), 'Unsafe archive path'
              z.extractall(root)
          project = root / 'TraderDesk_Android_Project'
          text = (project / 'pubspec.yaml').read_text()
          match = re.search(r'^version:\s*[\"\']?([^\s\"\']+)', text, re.M)
          assert match and match.group(1) == '1.4.0+35', 'Internal version does not match 1.4.0+35'
          (project / 'android/local.properties').unlink(missing_ok=True)
          print('Verified archive and internal version 1.4.0+35')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
      - name: Resolve and build exact version
        shell: bash
        run: |
          set -o pipefail
          cd source-140/TraderDesk_Android_Project
          {
            flutter --version
            java -version
            flutter pub get --enforce-lockfile && flutter build apk --debug --no-pub
          } 2>&1 | tee "$GITHUB_WORKSPACE/TRADERDESK_140_BUILD.log"
      - name: Collect APK
        run: |
          mkdir -p apk-140
          cp source-140/TraderDesk_Android_Project/build/app/outputs/flutter-apk/app-debug.apk apk-140/TraderDesk-v1.4.0+35-debug.apk
          cd apk-140
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TraderDesk-v1.4.0-build35
          path: apk-140/*
          if-no-files-found: error
      - name: Publish new version only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "traderdesk-v1.4.0-build35-${{ github.run_id }}" apk-140/* --target "${{ github.sha }}" --title "TraderDesk 1.4.0+35 debug APK" --notes "Built exclusively from verified v1.4.0+35 archive. Debug signing for testing, not production signing."
      - name: Save build log
        if: always()
        run: |
          if [ -f TRADERDESK_140_BUILD.log ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add TRADERDESK_140_BUILD.log
            git diff --cached --quiet || (git commit -m 'Record TraderDesk 1.4.0+35 build log' && git push)
          fi
