name: TraderDesk 1.5.9 ARM64 only 83cac2ef
on:
  push:
    paths: [.github/workflows/build-159-83cac2ef.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2888e641f64d0e3e409e6936db4c69f7c8a5e8e1
      - name: Verify source and version
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, hashlib, re, os
          p = pathlib.Path('TraderDesk_Android_Project_v1.5.9_ARM64_ONLY.zip')
          data = p.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == '83cac2ef0058143c03ac4bf4cee13b29c549b461', 'Wrong archive'
          root = pathlib.Path('source-159').resolve()
          root.mkdir()
          with zipfile.ZipFile(p) as z:
              for i in z.infolist():
                  assert (root / i.filename).resolve().is_relative_to(root), 'Unsafe path'
              z.extractall(root)
          projects = []
          for f in root.rglob('pubspec.yaml'):
              m = re.search(r'^version:\s*[\"\']?([^\s\"\']+)', f.read_text(), re.M)
              if m and m.group(1).split('+')[0] == '1.5.9' and (f.parent / 'android').is_dir():
                  projects.append((f.parent, m.group(1)))
          assert len(projects) == 1, 'Expected one Android project at version 1.5.9'
          project, version = projects[0]
          assert re.fullmatch(r'[0-9A-Za-z.+-]+', version), 'Invalid version'
          (project / 'android/local.properties').unlink(missing_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'PROJECT_DIR={project}\nAPP_VERSION={version}\n')
          pathlib.Path('SOURCE_INFO.txt').write_text(f'Archive: {p}\nVersion: {version}\nGit blob: 83cac2ef0058143c03ac4bf4cee13b29c549b461\nABI: arm64-v8a only\nDebug signing for testing, not production.\n')
          print(pathlib.Path('SOURCE_INFO.txt').read_text())
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
      - name: Build arm64-v8a debug APK only
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          { flutter --version && flutter pub get --enforce-lockfile && flutter build apk --debug --target-platform android-arm64 --no-pub; } 2>&1 | tee "$GITHUB_WORKSPACE/BUILD_159.log"
      - name: Collect and verify single ABI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-159
          SRC="$PROJECT_DIR/build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$SRC"
          LIBS="$(unzip -Z1 "$SRC" | grep '^lib/' || true)"
          echo "$LIBS" | grep -q '^lib/arm64-v8a/'
          if echo "$LIBS" | grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/'; then echo 'Unexpected extra ABI'; exit 1; fi
          cp "$SRC" "apk-159/TraderDesk-${APP_VERSION}-83cac2ef-arm64-v8a-debug.apk"
          cp SOURCE_INFO.txt apk-159/
          cd apk-159
          test "$(ls *.apk | wc -l)" -eq 1
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TraderDesk-1.5.9-83cac2ef-arm64
          path: apk-159/*
          if-no-files-found: error
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "traderdesk-1.5.9-83cac2ef-arm64-${{ github.run_id }}" apk-159/* --target 2888e641f64d0e3e409e6936db4c69f7c8a5e8e1 --title "TraderDesk ${APP_VERSION} arm64-v8a debug APK 83cac2ef" --notes-file SOURCE_INFO.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TraderDesk-1.5.9-83cac2ef-diagnostics
          path: |
            SOURCE_INFO.txt
            BUILD_159.log
          if-no-files-found: warn
