name: TraderDesk ARM64 Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: traderdesk-release-${{ github.ref }}
  cancel-in-progress: true
env:
  RELEASE: '1.7.111+168'
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify and inspect source
        run: |
          python3 - <<'PY'
          import os, pathlib, zipfile, stat, hashlib
          a = pathlib.Path('TraderDesk_Android_Project_v1_7_111_168تجربة01.zip')
          b = a.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest() == 'e4709ecceae5722b7167350a2e6c8458821b2cfd'
          root = pathlib.Path('release-source').resolve()
          root.mkdir()
          with zipfile.ZipFile(a) as z:
              entries = z.infolist()
              assert len(entries) <= 20000 and sum(e.file_size for e in entries) <= 1073741824
              assert len({e.filename for e in entries}) == len(entries)
              for e in entries:
                  p = pathlib.PurePosixPath(e.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in e.filename
                  assert not any(ord(c) < 32 for c in e.filename)
                  assert not stat.S_ISLNK(e.external_attr >> 16)
                  assert (root/e.filename).resolve().is_relative_to(root)
              assert z.testzip() is None
              z.extractall(root)
          projects = [p.parent for p in root.rglob('pubspec.yaml') if (p.parent/'android').is_dir() and (p.parent/'lib').is_dir()]
          assert len(projects) == 1
          p = projects[0]
          (p/'android/local.properties').unlink(missing_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'PROJECT_DIR={p}\n')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Inspect and build ARM64 Release AOT
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter --version
          cat pubspec.yaml
          find android -type f \( -name '*.gradle' -o -name '*.kts' -o -name 'gradle-wrapper.properties' -o -name '*.pro' \) -print -exec cat {} \;
          flutter pub get --enforce-lockfile
          flutter build apk --release --target-platform android-arm64 --no-pub --split-debug-info="$GITHUB_WORKSPACE/symbols"
      - name: Verify and measure APK
        id: verify
        run: |
          python3 - <<'PY'
          import pathlib, os, zipfile, subprocess, re, shutil, hashlib, json
          src = pathlib.Path(os.environ['PROJECT_DIR'])/'build/app/outputs/flutter-apk/app-release.apk'
          with zipfile.ZipFile(src) as z:
              assert {n.split('/')[1] for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')} == {'arm64-v8a'}
              assert 'lib/arm64-v8a/libapp.so' in z.namelist()
          tools = pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0'
          text = subprocess.check_output([str(tools/'aapt'), 'dump', 'badging', str(src)], text=True)
          assert 'application-debuggable' not in text
          assert re.search(r"versionName='([^']+)'", text).group(1) == '1.7.111'
          assert re.search(r"versionCode='([^']+)'", text).group(1) == '168'
          subprocess.run([str(tools/'apksigner'), 'verify', '--print-certs', str(src)], check=True)
          pathlib.Path('release-apk').mkdir()
          dst = pathlib.Path('release-apk/TraderDesk-1.7.111+168-trial01-arm64-v8a-release.apk')
          shutil.copy2(src, dst)
          info = dict(filename=dst.name, bytes=dst.stat().st_size, MiB=round(dst.stat().st_size/1048576, 2), sha256=hashlib.sha256(dst.read_bytes()).hexdigest())
          pathlib.Path('diagnostics').mkdir(exist_ok=True)
          pathlib.Path('diagnostics/APK_INFO.json').write_text(json.dumps(info, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(json.dumps(info, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        id: apk
        with:
          name: TraderDesk-1.7.111+168-trial01-ARM64-RELEASE-${{ github.run_number }}
          path: release-apk/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TraderDesk-symbols-${{ github.run_number }}
          path: symbols/
          if-no-files-found: warn
      - name: Publish result
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import os, pathlib, json, shutil
          e = os.environ
          p = pathlib.Path('.inspection')/e['RELEASE']/e['GITHUB_RUN_ID']
          p.mkdir(parents=True, exist_ok=True)
          if pathlib.Path('diagnostics/APK_INFO.json').exists():
              shutil.copy2('diagnostics/APK_INFO.json', p/'APK_INFO.json')
          result = dict(status=e['BUILD_STATUS'], steps=json.loads(e['STEPS_JSON']), artifact_url=e.get('ARTIFACT_URL', ''), run_url=e['GITHUB_SERVER_URL']+'/'+e['GITHUB_REPOSITORY']+'/actions/runs/'+e['GITHUB_RUN_ID'], source_commit=e['GITHUB_SHA'])
          (p/'RESULT.json').write_text(json.dumps(result, indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ".inspection/$RELEASE/$GITHUB_RUN_ID/"
          git commit -m "Publish TraderDesk $RELEASE result [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
