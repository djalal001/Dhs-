name: TraderDesk ARM64 Release
on: [push, workflow_dispatch]
permissions:
  contents: write
concurrency:
  group: traderdesk-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source and inspect configuration
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, hashlib, stat, os, json
          archive = pathlib.Path('TraderDesk_Android_Project_v1.7.30+86_GPT_SOURCE.zip')
          raw = archive.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == '01099cecd452f0a4e1a63c37912c0e7394066c82'
          root = pathlib.Path('release-source').resolve()
          root.mkdir()
          with zipfile.ZipFile(archive) as z:
              entries = z.infolist()
              assert len(entries) <= 20000 and sum(e.file_size for e in entries) <= 1073741824
              assert len({e.filename for e in entries}) == len(entries)
              for e in entries:
                  p = pathlib.PurePosixPath(e.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in e.filename
                  assert not stat.S_ISLNK(e.external_attr >> 16)
                  assert (root / e.filename).resolve().is_relative_to(root)
              assert z.testzip() is None
              z.extractall(root)
          projects = [p.parent for p in root.rglob('pubspec.yaml') if (p.parent / 'android').is_dir() and (p.parent / 'lib').is_dir()]
          assert len(projects) == 1
          project = projects[0]
          report = pathlib.Path('.inspection/1.7.30+86') / os.environ['GITHUB_RUN_ID']
          report.mkdir(parents=True)
          for p in project.rglob('*'):
              if p.is_file() and (p.name in {'pubspec.yaml', 'pubspec.lock', 'gradle-wrapper.properties'} or p.suffix in {'.gradle', '.kts', '.pro'}):
                  dest = report / 'configuration' / p.relative_to(project)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(p.read_bytes())
          (report / 'SOURCE.json').write_text(json.dumps({'archive': archive.name, 'sha256': hashlib.sha256(raw).hexdigest()}, indent=2))
          (project / 'android/local.properties').unlink(missing_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'PROJECT_DIR={project}\nREPORT={report}\n')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Build Release AOT ARM64
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          {
            flutter --version
            flutter pub get --enforce-lockfile
            flutter build apk --release --target-platform android-arm64 --no-pub --no-tree-shake-icons --split-debug-info="$GITHUB_WORKSPACE/symbols"
          } 2>&1 | tee "$GITHUB_WORKSPACE/RELEASE_BUILD.log"
      - name: Verify APK and measure size
        id: verify
        run: |
          python3 - <<'PY'
          import pathlib, os, zipfile, subprocess, re, hashlib, json, shutil
          src = pathlib.Path(os.environ['PROJECT_DIR']) / 'build/app/outputs/flutter-apk/app-release.apk'
          with zipfile.ZipFile(src) as z:
              assert {p.split('/')[1] for p in z.namelist() if p.startswith('lib/') and p.endswith('.so')} == {'arm64-v8a'}
              assert 'lib/arm64-v8a/libapp.so' in z.namelist()
          tools = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0'
          badging = subprocess.check_output([str(tools / 'aapt'), 'dump', 'badging', str(src)], text=True)
          pathlib.Path('APK_BADGING.txt').write_text(badging)
          assert 'application-debuggable' not in badging
          assert re.search(r"versionName='([^']+)'", badging).group(1) == '1.7.30'
          assert re.search(r"versionCode='([^']+)'", badging).group(1) == '86'
          out = pathlib.Path('release-apk')
          out.mkdir()
          dst = out / 'TraderDesk-1.7.30+86-arm64-v8a-release.apk'
          shutil.copy2(src, dst)
          with open('SIGNING_REPORT.txt', 'w') as f:
              subprocess.run([str(tools / 'apksigner'), 'verify', '--print-certs', str(dst)], check=True, stdout=f)
          info = dict(filename=dst.name, bytes=dst.stat().st_size, MiB=round(dst.stat().st_size / 1048576, 2), sha256=hashlib.sha256(dst.read_bytes()).hexdigest())
          (out / 'APK_INFO.json').write_text(json.dumps(info, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(json.dumps(info, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        id: apk
        with:
          name: TraderDesk-1.7.30+86-ARM64-RELEASE-${{ github.run_number }}
          path: release-apk/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TraderDesk-diagnostics-${{ github.run_number }}
          path: |
            RELEASE_BUILD.log
            APK_BADGING.txt
            SIGNING_REPORT.txt
            symbols/
            .inspection/1.7.30+86/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Publish result
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, os, json, shutil
          report = pathlib.Path('.inspection/1.7.30+86') / os.environ['GITHUB_RUN_ID']
          report.mkdir(parents=True, exist_ok=True)
          for name in ['RELEASE_BUILD.log', 'APK_BADGING.txt', 'SIGNING_REPORT.txt', 'release-apk/APK_INFO.json']:
              p = pathlib.Path(name)
              if p.is_file():
                  shutil.copy2(p, report / p.name)
          result = dict(status=os.environ['BUILD_STATUS'], steps=json.loads(os.environ['STEPS_JSON']), artifact_url=os.environ.get('ARTIFACT_URL', ''), run_url=os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'], source_commit=os.environ['GITHUB_SHA'])
          (report / 'RESULT.json').write_text(json.dumps(result, indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .inspection/1.7.30+86/
          git commit -m 'Publish TraderDesk 1.7.30+86 build result [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
