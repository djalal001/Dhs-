name: TraderDesk ARM64 Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: traderdesk-release-${{ github.ref }}
  cancel-in-progress: true
env:
  RELEASE_VERSION: '1.7.88'
  RELEASE_CODE: '144'
  SOURCE_BLOB: d923c680fa1dc5cd35ce233428dcb616083d208f
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract Android source
        run: |
          mkdir -p diagnostics
          python3 - <<'PY'
          import hashlib, os, pathlib, stat, zipfile
          v, c = os.environ['RELEASE_VERSION'], os.environ['RELEASE_CODE']
          a = pathlib.Path(f'TraderDesk_Android_Project_v{v}+{c}_GPT_SOURCE.zip')
          b = a.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest() == os.environ['SOURCE_BLOB']
          root = pathlib.Path('release-source').resolve()
          root.mkdir()
          with zipfile.ZipFile(a) as z:
              entries = z.infolist()
              assert len(entries) <= 20000 and sum(e.file_size for e in entries) <= 1073741824
              assert len({e.filename for e in entries}) == len(entries)
              for e in entries:
                  p = pathlib.PurePosixPath(e.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in e.filename
                  assert not any(ord(ch) < 32 for ch in e.filename)
                  assert not stat.S_ISLNK(e.external_attr >> 16)
                  assert (root/e.filename).resolve().is_relative_to(root)
              assert z.testzip() is None
              z.extractall(root)
          projects = [p.parent for p in root.rglob('pubspec.yaml') if (p.parent/'android').is_dir() and (p.parent/'lib').is_dir()]
          assert len(projects) == 1
          project = projects[0]
          (project/'android/local.properties').unlink(missing_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'PROJECT_DIR={project}\n')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Inspect and build Release AOT ARM64
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter --version
          grep -E '^version[[:space:]]*:' pubspec.yaml
          test -f pubspec.lock
          grep '^distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties
          flutter pub get --enforce-lockfile
          flutter build apk --release --target-platform android-arm64 --no-pub --split-debug-info="$GITHUB_WORKSPACE/symbols"
      - name: Verify APK and record size
        id: verify
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, subprocess, zipfile
          v, c = os.environ['RELEASE_VERSION'], os.environ['RELEASE_CODE']
          src = pathlib.Path(os.environ['PROJECT_DIR'])/'build/app/outputs/flutter-apk/app-release.apk'
          with zipfile.ZipFile(src) as z:
              assert {p.split('/')[1] for p in z.namelist() if p.startswith('lib/') and p.endswith('.so')} == {'arm64-v8a'}
              assert 'lib/arm64-v8a/libapp.so' in z.namelist()
          tools = pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0'
          badging = subprocess.check_output([str(tools/'aapt'), 'dump', 'badging', str(src)], text=True)
          assert 'application-debuggable' not in badging
          assert re.search(r"versionName='([^']+)'", badging).group(1) == v
          assert re.search(r"versionCode='([^']+)'", badging).group(1) == c
          out = pathlib.Path('release-apk')
          out.mkdir()
          dst = out/f'TraderDesk-{v}+{c}-arm64-v8a-release.apk'
          shutil.copy2(src, dst)
          subprocess.run([str(tools/'apksigner'), 'verify', '--print-certs', str(dst)], check=True)
          size = dst.stat().st_size
          info = dict(filename=dst.name, bytes=size, MiB=round(size/1048576, 2), sha256=hashlib.sha256(dst.read_bytes()).hexdigest())
          data = json.dumps(info, indent=2)+'\n'
          pathlib.Path('diagnostics/APK_INFO.json').write_text(data)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(data)
          PY
      - uses: actions/upload-artifact@v4
        id: apk
        with:
          name: TraderDesk-${{ env.RELEASE_VERSION }}+${{ env.RELEASE_CODE }}-ARM64-RELEASE-${{ github.run_number }}
          path: release-apk/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TraderDesk-symbols-${{ github.run_number }}
          path: symbols/
          if-no-files-found: warn
      - name: Publish result
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          report=".inspection/$RELEASE_VERSION+$RELEASE_CODE/$GITHUB_RUN_ID"
          mkdir -p "$report"
          if [[ -f diagnostics/APK_INFO.json ]]; then cp diagnostics/APK_INFO.json "$report/"; fi
          python3 - "$report" <<'PY'
          import json, os, pathlib, sys
          e = os.environ
          result = dict(status=e['BUILD_STATUS'], steps=json.loads(e['STEPS_JSON']), artifact_url=e.get('ARTIFACT_URL', ''), run_url=e['GITHUB_SERVER_URL']+'/'+e['GITHUB_REPOSITORY']+'/actions/runs/'+e['GITHUB_RUN_ID'], source_commit=e['GITHUB_SHA'])
          (pathlib.Path(sys.argv[1])/'RESULT.json').write_text(json.dumps(result, indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$report/"
          git commit -m "Publish TraderDesk $RELEASE_VERSION+$RELEASE_CODE build result [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
