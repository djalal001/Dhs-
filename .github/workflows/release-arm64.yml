name: TraderDesk GPT ARM64 Release
on: [push, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: traderdesk-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact source and inspect build configuration
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, os, hashlib
          archive = pathlib.Path('TraderDesk_Android_Project_v1.7.11+67_GPT_SOURCE.zip')
          root = pathlib.Path('release-source').resolve()
          root.mkdir()
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  assert (root / item.filename).resolve().is_relative_to(root), 'Unsafe archive path'
              z.extractall(root)
          projects = [p.parent for p in root.rglob('pubspec.yaml') if (p.parent / 'android').is_dir() and (p.parent / 'lib').is_dir()]
          assert len(projects) == 1, str(projects)
          project = projects[0]
          report = [str(archive), hashlib.sha256(archive.read_bytes()).hexdigest()]
          for p in [project / 'pubspec.yaml'] + list((project / 'android').rglob('*.gradle*')) + list((project / 'android').rglob('gradle-wrapper.properties')):
              if p.is_file():
                  report.append(str(p.relative_to(project)) + '\n' + p.read_text())
          pathlib.Path('INSPECTION.txt').write_text('\n'.join(report))
          print('\n'.join(report))
          (project / 'android/local.properties').unlink(missing_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'PROJECT_DIR={project}\n')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Build release AOT ARM64 only
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          {
            flutter --version
            flutter pub get --enforce-lockfile
            flutter build apk --release --target-platform android-arm64 --no-pub --no-tree-shake-icons --split-debug-info="$GITHUB_WORKSPACE/symbols"
          } 2>&1 | tee "$GITHUB_WORKSPACE/RELEASE_BUILD.log"
      - name: Verify release APK and record size
        run: |
          python3 - <<'PY'
          import pathlib, os, zipfile, subprocess, re, hashlib, json, shutil
          src = pathlib.Path(os.environ['PROJECT_DIR']) / 'build/app/outputs/flutter-apk/app-release.apk'
          with zipfile.ZipFile(src) as z:
              abis = {p.split('/')[1] for p in z.namelist() if p.startswith('lib/') and p.endswith('.so')}
              assert abis == {'arm64-v8a'}, str(abis)
              assert 'lib/arm64-v8a/libapp.so' in z.namelist(), 'AOT missing'
          tools = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0'
          badging = subprocess.check_output([str(tools / 'aapt'), 'dump', 'badging', str(src)], text=True)
          pathlib.Path('APK_BADGING.txt').write_text(badging)
          assert 'application-debuggable' not in badging, 'Debuggable APK rejected'
          version = re.search(r"versionName='([^']+)'", badging).group(1)
          code = re.search(r"versionCode='([^']+)'", badging).group(1)
          assert (version, code) == ('1.7.11', '67'), f'Unexpected version: {version}+{code}'
          out = pathlib.Path('release-apk')
          out.mkdir()
          dst = out / 'TraderDesk-1.7.11+67-arm64-v8a-release.apk'
          shutil.copy2(src, dst)
          info = dict(filename=dst.name, bytes=dst.stat().st_size, MiB=round(dst.stat().st_size / 1048576, 2), sha256=hashlib.sha256(dst.read_bytes()).hexdigest(), versionName=version, versionCode=code)
          text = json.dumps(info, indent=2)
          (out / 'APK_INFO.json').write_text(text)
          with open('SIGNING_REPORT.txt', 'w') as f:
              subprocess.run([str(tools / 'apksigner'), 'verify', '--print-certs', str(dst)], check=True, stdout=f)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(text + '\n')
          PY
      - uses: actions/upload-artifact@v4
        id: apk
        with:
          name: TraderDesk-1.7.11+67-ARM64-RELEASE-${{ github.run_number }}
          path: release-apk/*
          if-no-files-found: error
      - name: Record artifact link
        run: echo '${{ steps.apk.outputs.artifact-url }}' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TraderDesk-diagnostics-${{ github.run_number }}
          path: |
            INSPECTION.txt
            RELEASE_BUILD.log
            APK_BADGING.txt
            SIGNING_REPORT.txt
            symbols/
          if-no-files-found: warn
