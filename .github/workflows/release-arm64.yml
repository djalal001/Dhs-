name: TraderDesk ARM64 Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: traderdesk-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract source
        run: |
          mkdir -p diagnostics
          python3 - <<'PY'
          import pathlib, zipfile, hashlib, stat, os
          a = pathlib.Path('TraderDesk_Android_Project_v1.7.56+112_GPT_SOURCE.zip')
          b = a.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest() == 'e8d46d38c18cb237f94f7fb0bfe3d202e49deac5'
          root = pathlib.Path('release-source').resolve()
          root.mkdir()
          with zipfile.ZipFile(a) as z:
              entries = z.infolist()
              assert len(entries) <= 20000 and sum(e.file_size for e in entries) <= 1073741824
              assert len({e.filename for e in entries}) == len(entries)
              for e in entries:
                  p = pathlib.PurePosixPath(e.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in e.filename
                  assert not stat.S_ISLNK(e.external_attr >> 16)
                  assert (root/e.filename).resolve().is_relative_to(root)
              assert z.testzip() is None
              z.extractall(root)
          projects = [p.parent for p in root.rglob('pubspec.yaml') if (p.parent/'android').is_dir() and (p.parent/'lib').is_dir()]
          assert len(projects) == 1
          project = projects[0]
          (project/'android/local.properties').unlink(missing_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'PROJECT_DIR={project}\n')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore and save Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Inspect and build Release AOT ARM64
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          {
            flutter --version
            cat pubspec.yaml
            find android -type f \( -name '*.gradle' -o -name '*.kts' -o -name '*.pro' -o -name 'gradle-wrapper.properties' \) -print -exec cat {} \;
            flutter pub get --enforce-lockfile
            flutter build apk --release --target-platform android-arm64 --no-pub --split-debug-info="$GITHUB_WORKSPACE/symbols"
          } 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/RELEASE_BUILD.log"
      - name: Verify APK
        id: verify
        run: |
          python3 - <<'PY'
          import pathlib, os, zipfile, subprocess, re, hashlib, json, shutil
          src = pathlib.Path(os.environ['PROJECT_DIR'])/'build/app/outputs/flutter-apk/app-release.apk'
          with zipfile.ZipFile(src) as z:
              assert {p.split('/')[1] for p in z.namelist() if p.startswith('lib/') and p.endswith('.so')} == {'arm64-v8a'}
              assert 'lib/arm64-v8a/libapp.so' in z.namelist()
          tools = pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0'
          badging = subprocess.check_output([str(tools/'aapt'), 'dump', 'badging', str(src)], text=True)
          pathlib.Path('diagnostics/APK_BADGING.txt').write_text(badging)
          assert 'application-debuggable' not in badging
          assert re.search(r"versionName='([^']+)'", badging).group(1) == '1.7.56'
          assert re.search(r"versionCode='([^']+)'", badging).group(1) == '112'
          out = pathlib.Path('release-apk')
          out.mkdir()
          dst = out/'TraderDesk-1.7.56+112-arm64-v8a-release.apk'
          shutil.copy2(src, dst)
          with open('diagnostics/SIGNING_REPORT.txt', 'w') as f:
              subprocess.run([str(tools/'apksigner'), 'verify', '--print-certs', str(dst)], check=True, stdout=f)
          info = dict(filename=dst.name, bytes=dst.stat().st_size, MiB=round(dst.stat().st_size/1048576, 2), sha256=hashlib.sha256(dst.read_bytes()).hexdigest())
          pathlib.Path('diagnostics/APK_INFO.json').write_text(json.dumps(info, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(json.dumps(info, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        id: apk
        with:
          name: TraderDesk-1.7.56+112-ARM64-RELEASE-${{ github.run_number }}
          path: release-apk/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TraderDesk-diagnostics-${{ github.run_number }}
          path: |
            diagnostics/
            symbols/
          if-no-files-found: warn
      - name: Publish result
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import pathlib, os, json, shutil
          report = pathlib.Path('.inspection/1.7.56+112')/os.environ['GITHUB_RUN_ID']
          report.mkdir(parents=True, exist_ok=True)
          if pathlib.Path('diagnostics').is_dir():
              shutil.copytree('diagnostics', report, dirs_exist_ok=True)
          result = dict(status=os.environ['BUILD_STATUS'], steps=json.loads(os.environ['STEPS_JSON']), artifact_url=os.environ.get('ARTIFACT_URL', ''), run_url=os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'], source_commit=os.environ['GITHUB_SHA'])
          (report/'RESULT.json').write_text(json.dumps(result, indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .inspection/1.7.56+112/
          git commit -m 'Publish TraderDesk 1.7.56+112 build result [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
