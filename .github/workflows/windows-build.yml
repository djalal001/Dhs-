name: TradeEntryChecklist Windows Build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tradeentrychecklist-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Verify and inspect source
        id: inspect
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'TradeEntryChecklist_Windows_Project_v1.0.0.zip'
          $hash = (git hash-object -- $zip).Trim()
          if ($LASTEXITCODE -ne 0 -or $hash -ne 'd9c3c61918f9b6cc4d0ff23449960022576f9cee') { throw "Unexpected Git blob: $hash" }
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          Expand-Archive $zip -DestinationPath project-source
          Get-ChildItem project-source -Recurse -File | Select-Object FullName,Length | Format-Table -AutoSize | Out-String -Width 4096 | Set-Content diagnostics/FILES.txt
          $candidates = @(Get-ChildItem project-source -Recurse -File | Where-Object { $_.Name -in @('pubspec.yaml','package.json') -or $_.Extension -eq '.csproj' })
          foreach ($file in $candidates) {
            Add-Content diagnostics/PROJECT_CONFIG.txt "`n--- $($file.FullName) ---"
            Get-Content $file.FullName | Add-Content diagnostics/PROJECT_CONFIG.txt
          }
          $projects = @($candidates | Where-Object { $_.FullName -notmatch '[\\/](node_modules|build|obj|bin)[\\/]' })
          $flutter = @($projects | Where-Object { $_.Name -eq 'pubspec.yaml' -and (Test-Path (Join-Path $_.DirectoryName 'windows')) })
          $node = @($projects | Where-Object { $_.Name -eq 'package.json' })
          $net = @($projects | Where-Object { $_.Extension -eq '.csproj' })
          if ($flutter.Count -eq 1) { $type = 'flutter'; $project = $flutter[0] }
          elseif ($node.Count -eq 1) { $type = 'node'; $project = $node[0] }
          elseif ($net.Count -eq 1) { $type = 'dotnet'; $project = $net[0] }
          else { throw 'Project type is unsupported or ambiguous; inspect diagnostics before selecting a build command.' }
          "type=$type" >> $env:GITHUB_OUTPUT
          "PROJECT_DIR=$($project.DirectoryName)" >> $env:GITHUB_ENV
          "PROJECT_FILE=$($project.FullName)" >> $env:GITHUB_ENV
      - uses: subosito/flutter-action@v2
        if: steps.inspect.outputs.type == 'flutter'
        with:
          channel: stable
          cache: true
      - name: Build and collect Windows output
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $out = Join-Path $env:GITHUB_WORKSPACE 'windows-output'
          New-Item -ItemType Directory -Force $out | Out-Null
          Set-Location $env:PROJECT_DIR
          $type = '${{ steps.inspect.outputs.type }}'
          if ($type -eq 'flutter') {
            flutter --version
            flutter pub get
            flutter build windows --release
            $release = Join-Path $env:PROJECT_DIR 'build/windows/x64/runner/Release'
            if (-not (Test-Path $release)) { throw 'Windows Release output not found' }
            Copy-Item "$release/*" $out -Recurse -Force
          } elseif ($type -eq 'dotnet') {
            dotnet --info
            dotnet publish $env:PROJECT_FILE -c Release -r win-x64 --self-contained true -o $out
          } elseif ($type -eq 'node') {
            node --version
            npm --version
            if (Test-Path package-lock.json) { npm ci } else { npm install }
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            if ($pkg.scripts.dist) { npm run dist }
            elseif ($pkg.scripts.make) { npm run make }
            elseif ($pkg.scripts.build) { npm run build }
            else { throw 'No dist, make, or build script in package.json' }
            $dirs = @('dist','release','out','build') | Where-Object { Test-Path $_ }
            foreach ($dir in $dirs) { Copy-Item $dir (Join-Path $out $dir) -Recurse -Force }
          }
          $executables = @(Get-ChildItem $out -Recurse -File -Filter *.exe)
          if ($executables.Count -eq 0) { throw 'No Windows executable produced; refusing to publish a diagnostics-only build as an application.' }
          $files = @(Get-ChildItem $out -Recurse -File)
          $report = @($files | ForEach-Object { [pscustomobject]@{ File=$_.FullName.Substring($out.Length+1); Bytes=$_.Length; SHA256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash } })
          $report | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $env:GITHUB_WORKSPACE 'diagnostics/OUTPUT.json')
          $bytes = ($files | Measure-Object Length -Sum).Sum
          "Windows output: $bytes bytes; $($executables.Count) executable(s)." >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        id: app
        with:
          name: TradeEntryChecklist-Windows-Release-${{ github.run_number }}
          path: windows-output/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TradeEntryChecklist-Windows-Diagnostics-${{ github.run_number }}
          path: diagnostics/
          if-no-files-found: warn
      - name: Publish artifact URL
        if: steps.app.outcome == 'success'
        run: |
          '${{ steps.app.outputs.artifact-url }}' >> $env:GITHUB_STEP_SUMMARY
