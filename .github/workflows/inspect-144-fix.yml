name: Inspect TraderDesk 144 constructor error
on:
  push:
    paths: ['.github/workflows/inspect-144-fix.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read source without executing it
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, hashlib
          a = pathlib.Path('TraderDesk_Android_Project_v1.7.88+144_GPT_SOURCE.zip')
          b = a.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest() == 'd923c680fa1dc5cd35ce233428dcb616083d208f'
          with zipfile.ZipFile(a) as z:
              names = [n for n in z.namelist() if n.endswith('/lib/screens/trade_screen.dart') or n == 'lib/screens/trade_screen.dart']
              assert len(names) == 1
              assert z.getinfo(names[0]).file_size < 2000000
              text = z.read(names[0]).decode('utf-8')
          out = pathlib.Path('.inspection/fix-144')
          out.mkdir(parents=True, exist_ok=True)
          (out/'trade_screen.dart.txt').write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .inspection/fix-144/trade_screen.dart.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Publish source for constructor inspection [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
