name: TraderDesk 1.5.6 build42
on:
  push:
    paths: [.github/workflows/build-156.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, hashlib, re, os
          p = pathlib.Path('TraderDesk_Android_Project_v1.5.6_build42_GitHub.zip')
          data = p.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == 'efba37d53cc902da8ae0fb8365ea2f8d5cda312b', 'Archive changed'
          root = pathlib.Path('source-156').resolve()
          root.mkdir()
          with zipfile.ZipFile(p) as z:
              for i in z.infolist():
                  assert (root / i.filename).resolve().is_relative_to(root), 'Unsafe path'
              z.extractall(root)
          projects = []
          for f in root.rglob('pubspec.yaml'):
              m = re.search(r'^version:\s*[\"\']?([^\s\"\']+)', f.read_text(), re.M)
              if m and m.group(1) == '1.5.6+42' and (f.parent / 'android').is_dir():
                  projects.append(f.parent)
          assert len(projects) == 1, 'Expected one Android project at version 1.5.6+42'
          project = projects[0]
          (project / 'android/local.properties').unlink(missing_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'PROJECT_DIR={project}\n')
          print('Verified 1.5.6+42:', project)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          { flutter pub get --enforce-lockfile && flutter build apk --debug --no-pub; } 2>&1 | tee "$GITHUB_WORKSPACE/BUILD_156.log"
      - name: Collect
        run: |
          mkdir -p apk-156
          cp "$PROJECT_DIR/build/app/outputs/flutter-apk/app-debug.apk" apk-156/TraderDesk-v1.5.6+42-debug.apk
          cd apk-156
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TraderDesk-1.5.6-build42
          path: apk-156/*
          if-no-files-found: error
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "traderdesk-v1.5.6-build42-${{ github.run_id }}" apk-156/* --target "${{ github.sha }}" --title "TraderDesk 1.5.6+42 debug APK" --notes "Built from verified TraderDesk_Android_Project_v1.5.6_build42_GitHub.zip. Debug signing for testing, not production."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TraderDesk-1.5.6-build42-log
          path: BUILD_156.log
          if-no-files-found: warn
