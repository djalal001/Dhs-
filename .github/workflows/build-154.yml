name: TraderDesk 1.5.4+40 APK
on:
  push:
    paths: [.github/workflows/build-154.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract exact archive
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, hashlib, re, os
          p = pathlib.Path('TraderDesk_Android_Project_v1.5.4+40_InfoZIP3_GitHub.zip')
          data = p.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == '3a5bfb25d92ae2025a2d1bcd79edda91a5257b16', 'Archive changed'
          root = pathlib.Path('source-154').resolve()
          root.mkdir()
          with zipfile.ZipFile(p) as z:
              for i in z.infolist():
                  assert (root / i.filename).resolve().is_relative_to(root), 'Unsafe archive path'
              z.extractall(root)
          projects = []
          for f in root.rglob('pubspec.yaml'):
              m = re.search(r'^version:\s*[\"\']?([^\s\"\']+)', f.read_text(), re.M)
              if m and m.group(1) == '1.5.4+40' and (f.parent / 'android').is_dir():
                  projects.append(f.parent)
          assert len(projects) == 1, 'Expected exactly one Android project at version 1.5.4+40'
          project = projects[0]
          (project / 'android/local.properties').unlink(missing_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'PROJECT_DIR={project}\n')
          print('Verified archive and internal version 1.5.4+40:', project)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          {
            flutter --version
            java -version
            flutter pub get --enforce-lockfile && flutter build apk --debug --no-pub
          } 2>&1 | tee "$GITHUB_WORKSPACE/TRADERDESK_154_BUILD.log"
      - name: Collect APK
        run: |
          mkdir -p apk-154
          cp "$PROJECT_DIR/build/app/outputs/flutter-apk/app-debug.apk" apk-154/TraderDesk-v1.5.4+40-debug.apk
          cd apk-154
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TraderDesk-v1.5.4-build40
          path: apk-154/*
          if-no-files-found: error
      - name: Publish debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "traderdesk-v1.5.4-build40-${{ github.run_id }}" apk-154/* --target "${{ github.sha }}" --title "TraderDesk 1.5.4+40 debug APK" --notes "Built from the verified 1.5.4+40 archive. Debug signing for testing, not production signing."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TraderDesk-v1.5.4-build40-log
          path: TRADERDESK_154_BUILD.log
          if-no-files-found: warn
