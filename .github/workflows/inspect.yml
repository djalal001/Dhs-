name: Inspect TraderDesk 1.3.9+34
on:
  push:
    paths: [.github/workflows/inspect.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read archive configuration without executing project
        run: |
          python3 - <<'PY'
          import zipfile, pathlib, re, hashlib
          archive = pathlib.Path('TraderDesk_Android_Project_v1.3.9+34.zip')
          report = ['Archive: ' + archive.name, 'SHA256: ' + hashlib.sha256(archive.read_bytes()).hexdigest()]
          wanted = {'pubspec.yaml','pubspec.lock','.metadata','.fvmrc','fvm_config.json','settings.gradle','settings.gradle.kts','build.gradle','build.gradle.kts','gradle-wrapper.properties','gradle.properties'}
          with zipfile.ZipFile(archive) as z:
              infos = z.infolist()
              report.append('Files: ' + str(len(infos)))
              for item in infos:
                  p = pathlib.PurePosixPath(item.filename)
                  if p.is_absolute() or '..' in p.parts:
                      raise RuntimeError('Unsafe archive path')
                  if p.name in wanted and item.file_size < 200000:
                      text = z.read(item).decode('utf-8', errors='replace')
                      lines = []
                      for line in text.splitlines():
                          if re.search(r'password|secret|token|api[_-]?key|credential', line, re.I):
                              lines.append('[REDACTED sensitive-looking line]')
                          else:
                              lines.append(line)
                      report.extend(['', '--- ' + item.filename + ' ---', '\n'.join(lines)])
              report.extend(['', '--- Source layout ---'])
              report.extend(i.filename for i in infos if pathlib.PurePosixPath(i.filename).name in ('main.dart','AndroidManifest.xml','gradlew') or i.filename.endswith('README.md'))
          pathlib.Path('TRADERDESK_INSPECTION.txt').write_text('\n'.join(report) + '\n')
          PY
      - name: Save inspection report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TRADERDESK_INSPECTION.txt
          git diff --cached --quiet || (git commit -m 'Record configuration inspection for TraderDesk v1.3.9+34' && git push)
