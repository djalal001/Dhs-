name: TraderDesk new archive b76bf1c1
on:
  push:
    paths: [.github/workflows/build-150-new-b76bf1c1.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify new archive
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, hashlib, re, os
          p = pathlib.Path('TraderDesk_Android_Project_v1_5_0_36.zip')
          data = p.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == 'b76bf1c164ed9caef7100817b31d5905f390eb22', 'Wrong archive'
          root = pathlib.Path('source-new').resolve()
          root.mkdir()
          with zipfile.ZipFile(p) as z:
              for i in z.infolist():
                  assert (root / i.filename).resolve().is_relative_to(root), 'Unsafe path'
              z.extractall(root)
          projects = []
          for f in root.rglob('pubspec.yaml'):
              m = re.search(r'^version:\s*[\"\']?([^\s\"\']+)', f.read_text(), re.M)
              if m and m.group(1) == '1.5.0+36' and (f.parent / 'android').is_dir():
                  projects.append(f.parent)
          assert len(projects) == 1, 'Expected one Android project at version 1.5.0+36'
          project = projects[0]
          (project / 'android/local.properties').unlink(missing_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'PROJECT_DIR={project}\n')
          print('Verified new archive:', p, project)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          { flutter pub get --enforce-lockfile && flutter build apk --debug --no-pub; } 2>&1 | tee "$GITHUB_WORKSPACE/BUILD_NEW.log"
      - name: Collect
        run: |
          mkdir -p apk-new
          cp "$PROJECT_DIR/build/app/outputs/flutter-apk/app-debug.apk" apk-new/TraderDesk-v1.5.0+36-new-b76bf1c1-debug.apk
          cd apk-new
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TraderDesk-new-b76bf1c1
          path: apk-new/*
          if-no-files-found: error
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "traderdesk-new-b76bf1c1-${{ github.run_id }}" apk-new/* --target "${{ github.sha }}" --title "TraderDesk 1.5.0+36 NEW b76bf1c1 debug APK" --notes "Source TraderDesk_Android_Project_v1_5_0_36.zip, not the earlier dotted-name archive. Debug signing for testing, not production."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TraderDesk-new-b76bf1c1-log
          path: BUILD_NEW.log
          if-no-files-found: warn
